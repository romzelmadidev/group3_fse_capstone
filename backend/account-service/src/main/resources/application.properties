# =========================================================================
# CAPSTONE FSE: Core Retail Ledger & Balance Mutation Engine
# Account Service Configuration & HikariCP Pool Isolation
# =========================================================================

spring.application.name=account-service
server.port=8081

# =========================================================================
# ORACLE XE 21c DATASOURCE CONFIGURATION
# =========================================================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=SYSTEM
spring.datasource.password=password123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Dedicated HikariCP Pool for Account & User Onboarding Service
spring.datasource.hikari.pool-name=HikariPool-AccountService
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# =========================================================================
# REDIS CACHE (Token Rotation & User Cache)
# =========================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# =========================================================================
# JPA & HIBERNATE SETTINGS
# =========================================================================
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

logging.level.com.bank.ledger=INFO
logging.level.com.zaxxer.hikari=DEBUG

# ==============================================================================
# FSE Capstone :: Account Lifecycle & KYC Microservice
# Port & Context Configuration
# ==============================================================================
spring.application.name=account-service
server.port=8081

# ==============================================================================
# DATASOURCE: ORACLE MASTER TRANSACTIONAL DATABASE
# Target: oracle-xe-master (:1521 / XEPDB1)
# ==============================================================================
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=fse_user
spring.datasource.password=fse_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==============================================================================
# HikariCP Thread Pool Dimensions (Isolated Configuration)
# ==============================================================================
spring.datasource.hikari.pool-name=AccountMasterHikariPool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL

# ==============================================================================
# JPA & Hibernate Settings
# ==============================================================================
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ==============================================================================
# Actuator & Observability
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

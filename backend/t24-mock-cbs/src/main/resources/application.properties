server.port=8085
spring.application.name=t24-mock-cbs

# Primary Master DB (Azure SQL / Oracle / Test Postgres)
spring.datasource.master.url=${MASTER_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=cbs_master;encrypt=false;trustServerCertificate=true}
spring.datasource.master.username=${MASTER_DB_USER:sa}
spring.datasource.master.password=${MASTER_DB_PASSWORD:SecurePass123!}
spring.datasource.master.driver-class-name=${MASTER_DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# PostgreSQL Immutable Audit Vault
spring.datasource.audit.url=${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit_vault}
spring.datasource.audit.username=${AUDIT_DB_USER:postgres}
spring.datasource.audit.password=${AUDIT_DB_PASSWORD:postgres}
spring.datasource.audit.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.open-in-view=false

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=cbs-audit-workers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

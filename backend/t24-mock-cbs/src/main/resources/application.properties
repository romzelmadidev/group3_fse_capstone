server.port=8085
spring.application.name=t24-mock-cbs

# Primary Master DB (Oracle / Azure SQL / Test Postgres)
spring.datasource.master.url=${SPRING_DATASOURCE_MASTER_URL:${SPRING_DATASOURCE_ORACLE_URL:${MASTER_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=cbs_master;encrypt=false;trustServerCertificate=true}}}
spring.datasource.master.username=${SPRING_DATASOURCE_MASTER_USERNAME:${SPRING_DATASOURCE_ORACLE_USERNAME:${MASTER_DB_USER:sa}}}
spring.datasource.master.password=${SPRING_DATASOURCE_MASTER_PASSWORD:${SPRING_DATASOURCE_ORACLE_PASSWORD:${MASTER_DB_PASSWORD:SecurePass123!}}}

# PostgreSQL Immutable Audit Vault
spring.datasource.audit.url=${SPRING_DATASOURCE_AUDIT_URL:${SPRING_DATASOURCE_POSTGRES_URL:${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit_vault}}}
spring.datasource.audit.username=${SPRING_DATASOURCE_AUDIT_USERNAME:${SPRING_DATASOURCE_POSTGRES_USERNAME:${AUDIT_DB_USER:postgres}}}
spring.datasource.audit.password=${SPRING_DATASOURCE_AUDIT_PASSWORD:${SPRING_DATASOURCE_POSTGRES_PASSWORD:${AUDIT_DB_PASSWORD:postgres}}}


# JPA & Hibernate
spring.jpa.open-in-view=false

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=cbs-audit-workers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Automated Close of Business (COB) Scheduling (Real-world banking cutoff: 21:00:00 / 9:00 PM)
cbs.cob.scheduler.enabled=${CBS_COB_SCHEDULER_ENABLED:true}
cbs.cob.scheduler.cron=${CBS_COB_SCHEDULER_CRON:0 0 21 * * *}
cbs.cob.scheduler.zone=${CBS_COB_SCHEDULER_ZONE:Asia/Manila}

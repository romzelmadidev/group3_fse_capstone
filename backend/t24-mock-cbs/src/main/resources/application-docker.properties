# Docker Container Profile for T24 Mock CBS
spring.datasource.master.url=${SPRING_DATASOURCE_ORACLE_URL:${MASTER_DB_URL:jdbc:oracle:thin:@oracle-xe-master:1521/XEPDB1}}
spring.datasource.master.username=${SPRING_DATASOURCE_ORACLE_USERNAME:${MASTER_DB_USER:fse_user}}
spring.datasource.master.password=${SPRING_DATASOURCE_ORACLE_PASSWORD:${MASTER_DB_PASSWORD:fse_password}}
spring.datasource.master.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.audit.url=${SPRING_DATASOURCE_POSTGRES_URL:${AUDIT_DB_URL:jdbc:postgresql://postgres-audit-vault:5432/banking_audit}}
spring.datasource.audit.username=${SPRING_DATASOURCE_POSTGRES_USERNAME:${AUDIT_DB_USER:audit_user}}
spring.datasource.audit.password=${SPRING_DATASOURCE_POSTGRES_PASSWORD:${AUDIT_DB_PASSWORD:audit_password}}
spring.datasource.audit.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis-cache}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-broker:29092}

# =========================================================================
# CAPSTONE FSE: Temenos T24 CBS Core Banking Simulation Engine
# Cloud Native Production Profile: Microsoft Azure (Azure SQL + Azure Postgres)
# =========================================================================

spring.application.name=t24-mock-cbs
server.port=8085

# Master Relational State: Azure SQL Database
spring.datasource.master.url=${AZURE_SQL_URL:jdbc:sqlserver://sql-banking-master.database.windows.net:1433;databaseName=sqldb-master;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
spring.datasource.master.username=${AZURE_SQL_USERNAME:sqladminuser}
spring.datasource.master.password=${AZURE_SQL_PASSWORD}
spring.datasource.master.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.master.hikari.maximum-pool-size=15
spring.datasource.master.hikari.minimum-idle=5
spring.datasource.master.hikari.connection-timeout=30000

# Immutable Audit Vault: In-Cluster PostgreSQL (or Azure Flexible Server)
spring.datasource.audit.url=${AZURE_POSTGRES_URL:jdbc:postgresql://postgres.banking.svc.cluster.local:5432/banking_audit}
spring.datasource.audit.username=${AZURE_POSTGRES_USERNAME:audit_admin}
spring.datasource.audit.password=${AZURE_POSTGRES_PASSWORD}
spring.datasource.audit.driver-class-name=org.postgresql.Driver
spring.datasource.audit.hikari.maximum-pool-size=15
spring.datasource.audit.hikari.minimum-idle=5
spring.datasource.audit.hikari.connection-timeout=30000

# JPA & Hibernate Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Flyway Database Migration
cbs.flyway.master.enabled=true
cbs.flyway.audit.enabled=true
cbs.flyway.baseline-on-migrate=true
cbs.flyway.seed-sample-data=false

# Kafka Event Bus
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.banking.svc.cluster.local:9092}
spring.kafka.consumer.group-id=cbs-audit-workers
spring.kafka.consumer.auto-offset-reset=earliest

# In-Cloud COB Cutoff: Internal cron disabled (delegated to K8s CronJob)
cbs.cob.scheduler.enabled=${CBS_COB_SCHEDULER_ENABLED:false}
cbs.cob.scheduler.cron=0 0 21 * * *
cbs.cob.scheduler.zone=Asia/Manila

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

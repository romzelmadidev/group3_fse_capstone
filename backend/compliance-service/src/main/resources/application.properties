server.port=8086
spring.application.name=compliance-service

# Microsoft Azurite Blob Storage Configuration
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:10000/devstoreaccount1;}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:compliance-vault}

# Downstream Service URLs
services.cbs.url=${CBS_SERVICE_URL:http://localhost:8085}
services.orchestrator.url=${ORCHESTRATOR_SERVICE_URL:http://localhost:8082}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=compliance-service-workers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Redis Configuration (ShedLock Distributed Mutex)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Autonomous DLQ Constrained Recovery Worker
app.dlq.recovery.enabled=${APP_DLQ_RECOVERY_ENABLED:true}
app.dlq.recovery.poll-interval-ms=${APP_DLQ_RECOVERY_POLL_INTERVAL_MS:30000}
app.dlq.recovery.max-age-minutes=${APP_DLQ_RECOVERY_MAX_AGE_MINUTES:10}
app.dlq.recovery.batch-size=${APP_DLQ_RECOVERY_BATCH_SIZE:10}
app.dlq.recovery.throttle-ms=${APP_DLQ_RECOVERY_THROTTLE_MS:300}


apiVersion: apps/v1
kind: Deployment
metadata:
  name: t24-mock-cbs
  namespace: banking
  labels:
    app: t24-mock-cbs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t24-mock-cbs
  template:
    metadata:
      labels:
        app: t24-mock-cbs
    spec:
      containers:
        - name: t24-mock-cbs
          image: __ACR_NAME__.azurecr.io/t24-mock-cbs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 35
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 45
            periodSeconds: 15
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/dd-java-agent.jar -XX:+UseSerialGC -Xms256m -Xmx640m"
            - name: DD_AGENT_HOST
              value: "dd-agent.banking.svc.cluster.local"
            - name: DD_SERVICE
              value: "t24-mock-cbs"
            - name: DD_ENV
              value: "azure"
            - name: SPRING_PROFILES_ACTIVE
              value: "azure"
            - name: CBS_COB_SCHEDULER_ENABLED
              value: "false"
            - name: AZURE_SQL_URL
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-sql-url
            - name: AZURE_SQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-sql-username
            - name: AZURE_SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-sql-password
            - name: AZURE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-postgres-url
            - name: AZURE_POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-postgres-username
            - name: AZURE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-postgres-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.banking.svc.cluster.local:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: t24-mock-cbs
  namespace: banking
  labels:
    app: t24-mock-cbs
spec:
  type: ClusterIP
  ports:
    - port: 8085
      targetPort: 8085
  selector:
    app: t24-mock-cbs

apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: banking
  labels:
    app: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: __ACR_NAME__.azurecr.io/account-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 15
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/dd-java-agent.jar -XX:+UseSerialGC -Xms128m -Xmx320m"
            - name: DD_AGENT_HOST
              value: "dd-agent.banking.svc.cluster.local"
            - name: DD_SERVICE
              value: "account-service"
            - name: DD_ENV
              value: "azure"
            - name: SPRING_PROFILES_ACTIVE
              value: "azure"
            - name: AZURE_SQL_URL
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-sql-url
            - name: AZURE_SQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-sql-username
            - name: AZURE_SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-sql-password
            - name: AZURE_REDIS_HOST
              value: "redis.banking.svc.cluster.local"
            - name: AZURE_REDIS_PORT
              value: "6379"
            - name: AZURE_REDIS_SSL
              value: "false"
            # KYC: without these the service falls back to local Azurite / localhost and uploads fail.
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-storage-connection-string
            - name: AZURE_STORAGE_CONTAINER_NAME
              value: "kyc-vault"
            - name: APP_SERVICES_RISK_SERVICE_URL
              value: "http://risk-service.banking.svc.cluster.local:8084"
            - name: APP_SERVICES_CBS_URL
              value: "http://t24-mock-cbs.banking.svc.cluster.local:8085"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service.banking.svc.cluster.local:8083"
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: banking
  labels:
    app: account-service
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: account-service

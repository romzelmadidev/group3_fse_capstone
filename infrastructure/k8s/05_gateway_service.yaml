apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: banking
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: __ACR_NAME__.azurecr.io/gateway-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 35
            periodSeconds: 15
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/dd-java-agent.jar -XX:+UseSerialGC -Xms128m -Xmx320m"
            - name: DD_AGENT_HOST
              value: "dd-agent.banking.svc.cluster.local"
            - name: DD_SERVICE
              value: "gateway-service"
            - name: DD_ENV
              value: "azure"
            - name: REDIS_HOST
              value: "redis.banking.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: ACCOUNT_SERVICE_URI
              value: "http://account-service.banking.svc.cluster.local:8081"
            - name: TRANSFER_ORCHESTRATOR_URI
              value: "http://transfer-orchestrator.banking.svc.cluster.local:8082"
            - name: CBS_SERVICE_URI
              value: "http://t24-mock-cbs.banking.svc.cluster.local:8085"
            - name: COMPLIANCE_SERVICE_URI
              value: "http://compliance-service.banking.svc.cluster.local:8086"
            - name: NOTIFICATION_SERVICE_URI
              value: "http://notification-service.banking.svc.cluster.local:8083"
            - name: MAILHOG_API_URI
              value: "http://mailhog.banking.svc.cluster.local:8025"
            - name: RISK_SERVICE_URI
              value: "http://risk-service.banking.svc.cluster.local:8084"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: jwt-secret
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: banking
  labels:
    app: gateway-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      name: http
    - port: 8080
      targetPort: 8080
      name: direct-gateway
  selector:
    app: gateway-service

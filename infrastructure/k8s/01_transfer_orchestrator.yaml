apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer-orchestrator
  namespace: banking
  labels:
    app: transfer-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transfer-orchestrator
  template:
    metadata:
      labels:
        app: transfer-orchestrator
    spec:
      containers:
        - name: transfer-orchestrator
          image: __ACR_NAME__.azurecr.io/transfer-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 15
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/dd-java-agent.jar -XX:+UseSerialGC -Xms128m -Xmx320m"
            - name: DD_AGENT_HOST
              value: "dd-agent.banking.svc.cluster.local"
            - name: DD_SERVICE
              value: "transfer-orchestrator"
            - name: DD_ENV
              value: "azure"
            - name: REDIS_HOST
              value: "redis.banking.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.banking.svc.cluster.local:9092"
            - name: RISK_SERVICE_URL
              value: "http://risk-service.banking.svc.cluster.local:8084"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service.banking.svc.cluster.local:8081"
            - name: CBS_SERVICE_URL
              value: "http://t24-mock-cbs.banking.svc.cluster.local:8085"
            - name: PARTNER_BANK_URL
              value: "http://transfer-orchestrator.banking.svc.cluster.local:8082/api/v1/mock-partner/transfers"
            - name: PARTNER_BANK_API_KEY
              value: "AURABANK-SECURE-KEY-2026"
---
apiVersion: v1
kind: Service
metadata:
  name: transfer-orchestrator
  namespace: banking
  labels:
    app: transfer-orchestrator
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: transfer-orchestrator

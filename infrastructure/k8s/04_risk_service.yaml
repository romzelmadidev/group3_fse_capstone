apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  namespace: banking
  labels:
    app: risk-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-service
  template:
    metadata:
      labels:
        app: risk-service
    spec:
      containers:
        - name: risk-service
          image: __ACR_NAME__.azurecr.io/risk-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8084
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 25
            periodSeconds: 15
          env:
            - name: PORT
              value: "8084"
            - name: DD_AGENT_HOST
              value: "dd-agent.banking.svc.cluster.local"
            - name: DD_SERVICE
              value: "risk-service"
            - name: DD_ENV
              value: "azure"
            # KYC: the evaluator downloads the ID/selfie blobs. Without this it falls back to
            # azurite-storage:10000 (does not exist in AKS) and the Azure SDK retries past the
            # 15 s read timeout of account-service -> "Unable to reach identity verification service".
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-storage-connection-string
---
apiVersion: v1
kind: Service
metadata:
  name: risk-service
  namespace: banking
  labels:
    app: risk-service
spec:
  type: ClusterIP
  ports:
    - port: 8084
      targetPort: 8084
  selector:
    app: risk-service

apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-service
  namespace: banking
  labels:
    app: compliance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compliance-service
  template:
    metadata:
      labels:
        app: compliance-service
    spec:
      containers:
        - name: compliance-service
          image: __ACR_NAME__.azurecr.io/compliance-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 45
            periodSeconds: 15
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/dd-java-agent.jar -XX:+UseSerialGC -Xms128m -Xmx320m"
            - name: DD_AGENT_HOST
              value: "dd-agent.banking.svc.cluster.local"
            - name: DD_SERVICE
              value: "compliance-service"
            - name: DD_ENV
              value: "azure"
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: azure-storage-connection-string
            - name: AZURE_STORAGE_CONTAINER
              value: "compliance-vault"
            - name: CBS_SERVICE_URL
              value: "http://t24-mock-cbs.banking.svc.cluster.local:8085"
            - name: ORCHESTRATOR_SERVICE_URL
              value: "http://transfer-orchestrator.banking.svc.cluster.local:8082"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.banking.svc.cluster.local:9092"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis.banking.svc.cluster.local"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-service
  namespace: banking
  labels:
    app: compliance-service
spec:
  type: ClusterIP
  ports:
    - port: 8086
      targetPort: 8086
  selector:
    app: compliance-service
